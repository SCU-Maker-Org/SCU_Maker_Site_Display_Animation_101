# ---------- SCU Maker 展台（由 install.sh 生成，可放 /etc/nginx/conf.d/maker.conf） ----------
server {
    listen      80;
    server_name _;

    root  /srv/maker/current;
    index index.html;

    # HTML 与配置文件不缓存：刷新即拿到新内容
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
    location ~* ^/js/(config|intro|poster|app)\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 视频：支持拖动 seek，缓存 7 天
    location ~* \.(mp4|webm)$ {
        expires 7d;
        add_header Content-Type video/mp4;
        try_files $uri =404;
    }

    # 其它图片 / 样式：缓存 7 天
    location ~* \.(css|png|jpe?g|svg|webp|gif|ico|woff2?)$ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}