# =============================================================================
# SCU Maker 展台 —— nginx 站点配置（Ubuntu / Debian 用）
# -----------------------------------------------------------------------------
# 安装位置：/etc/nginx/sites-available/maker.conf
#          并软链到 /etc/nginx/sites-enabled/maker.conf
#
# 重要：这是【server 片段】，只能包含 server{} 之类的 http 上下文指令。
#      worker_processes / events / http 只允许出现在 /etc/nginx/nginx.conf，
#      放进 sites-enabled 会报：
#        nginx: [emerg] "worker_processes" directive is not allowed here
# =============================================================================

server {
    listen      80 default_server;
    listen      [::]:80 default_server;
    server_name _;

    root  /srv/maker/current;
    index index.html;

    charset utf-8;
    server_tokens off;

    # HTML 与配置脚本不缓存：刷新即拿到新内容
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }
    location ~* ^/js/(config|intro|poster|app)\.js$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # 视频：支持 Range 拖动，缓存 7 天
    location ~* \.(mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # 其它图片 / 样式：缓存 7 天
    location ~* \.(css|png|jpe?g|svg|webp|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 健康检查
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}

